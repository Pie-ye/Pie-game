services:
  pie-game:
    build:
      context: /home/pieye/Container/Pie-game
    image: pie-game:local
    container_name: pie-game
    network_mode: host
    restart: unless-stopped
    environment:
      PG_SHELL_PORT: "54460"
      PG_CONTENT_PORT: "54461"
      PG_BIND: 127.0.0.1
      PG_SHELL_ORIGIN: https://game.coinpilet.win
      PG_CONTENT_ORIGIN: https://play.piea.uk
      PG_API_ORIGIN: https://coinpilet.win
      PG_RETIRE_BASE: http://127.0.0.1:54432
      PG_CONTENT_DIR: /srv/pie-content/live/site
    volumes:
      # 掛整個 content 根目錄，不是 live 連結本身：Docker 只在容器啟動時解析一次
      # bind 來源，綁連結的話之後的原子切換永遠進不來。live 是 releases/<sha> 的
      # 相對連結，伺服器每個請求重新解析。
      - /home/pieye/pie-game-content:/srv/pie-content:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:54460/healthz', timeout=2)
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
