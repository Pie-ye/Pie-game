<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多人遊戲範本</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>多人遊戲</h1>
    <p id="status">尚未連線</p>
    <div class="row">
      <button type="button" id="refresh">重新整理房間</button>
      <button type="button" id="create">開公開房</button>
    </div>
    <label>代碼 <input id="code" maxlength="6" autocomplete="off"></label>
    <button type="button" id="join">加入</button>
    <ul id="rooms"></ul>
    <p class="hint">金幣與多人不能並用：房主在自己瀏覽器裁定，平台只轉送。</p>
  </main>
</body>
</html>
