<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>派派鎮 · PIE PLAZA</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <section id="room" aria-label="派派鎮">
    <header>
      <b id="room-title">廣場</b>
      <span id="room-info" role="status">載入中…</span>
      <span id="cloud" title="存檔位置"></span>
      <button type="button" id="mute" aria-pressed="true">音效：開</button>
    </header>
    <div class="stage">
      <div class="frame">
        <canvas id="world" aria-label="遊戲畫面"></canvas>
        <div id="fade" aria-hidden="true"></div>
        <div id="clock" aria-label="時間與金幣"><b id="clock-day"></b><span id="clock-time"></span><span id="gold">0 G</span></div>
        <div id="event-badge" role="status" hidden></div>
        <div class="hud-btns"><button type="button" id="btn-visit">拜訪</button><button type="button" id="btn-market">市場</button><button type="button" id="btn-mail">信箱<span class="badge" id="mail-badge" hidden></span></button><button type="button" id="btn-emote">表情</button><button type="button" id="btn-look">捏臉</button><button type="button" id="btn-events">活動</button></div>
        <div id="toast" role="status" aria-live="polite"></div>
        <div id="inv" aria-label="背包"></div>
        <div id="toolbar" role="toolbar" aria-label="工具列"></div>
        <div id="dialog" hidden>
          <div class="face"><img id="dialog-face" alt=""></div>
          <div class="body"><b id="dialog-name"></b><p id="dialog-text"></p><span class="more">▼</span></div>
        </div>
        <div id="panel" class="panel" hidden>
          <div class="panel-head"><b id="panel-title"></b><button type="button" id="panel-close">完成</button></div>
          <div id="panel-body"></div>
        </div>
      </div>
    </div>
    <aside id="chat" class="panel">
      <ol id="log" aria-live="polite"></ol>
      <form id="chat-form">
        <input id="chat-input" maxlength="120" placeholder="按 Enter 打字" autocomplete="off" aria-label="聊天輸入">
        <button type="submit">送出</button>
      </form>
    </aside>
  </section>
</body>
</html>
