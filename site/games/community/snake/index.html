<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>貪吃蛇</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="cab">
    <h1 class="marquee"><span>S</span><span>N</span><span>A</span><span>K</span><span>E</span><small>貪吃蛇</small></h1>
    <div class="screen-row">
      <div class="bezel">
        <canvas id="board" width="320" height="320" aria-label="遊戲盤"></canvas>
        <p id="banner" class="banner">按任意方向開始</p>
        <div class="crt" aria-hidden="true"></div>
      </div>
      <aside class="lcd" aria-label="分數">
        <p>SCORE<strong id="score">0</strong></p>
        <p>HI-SCORE<strong id="best">0</strong></p>
      </aside>
    </div>
    <div class="deck">
      <div class="slot" aria-hidden="true"><i></i><span>INSERT COIN</span></div>
      <div class="pad" aria-label="方向">
        <button type="button" data-dir="up" aria-label="上">▲</button>
        <div class="mid">
          <button type="button" data-dir="left" aria-label="左">◀</button>
          <span class="ball" aria-hidden="true"></span>
          <button type="button" data-dir="right" aria-label="右">▶</button>
        </div>
        <button type="button" data-dir="down" aria-label="下">▼</button>
      </div>
      <div class="btns" aria-hidden="true"><i></i><i></i></div>
    </div>
  </main>
</body>
</html>
