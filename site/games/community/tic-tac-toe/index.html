<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>井字棋</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <main class="wrap">
    <h1>井字棋</h1>
    <p id="net" class="net" hidden>連線中斷，正在重連…</p>
    <section id="lobby">
      <p id="hello">連線中…</p>
      <div class="row">
        <button type="button" id="createPublic">開公開房</button>
        <button type="button" id="createPrivate">開私人房</button>
        <button type="button" id="refresh">重新整理</button>
      </div>
      <label class="join">代碼 <input id="code" maxlength="6" autocomplete="off"> <button type="button" id="joinCode">加入</button></label>
      <ul id="rooms"></ul>
    </section>
    <section id="table" hidden>
      <p id="meta"></p>
      <div id="board" class="board" role="grid" aria-label="棋盤"></div>
      <p id="turn"></p>
      <div class="row">
        <button type="button" id="leave">離開房間</button>
      </div>
    </section>
  </main>
</body>
</html>
